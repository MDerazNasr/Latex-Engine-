[workspace]
members = [
    "crates/latex-render-client",
    "crates/latex-render-core",
    "crates/latex-segmenter",
    "crates/latex-terminal",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
repository = "https://github.com/MDerazNasr/Latex-Engine-"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
missing_docs = "warn"
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
