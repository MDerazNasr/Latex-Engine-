[package]
name = "latex-cli"
description = "Standalone renderer and installation checks for Codex LaTeX output"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[[bin]]
name = "latex-render"
path = "src/main.rs"

[dependencies]
base64 = "=0.22.1"
latex-render-client = { path = "../latex-render-client" }
latex-render-core = { path = "../latex-render-core" }
latex-render-svg = { path = "../latex-render-svg" }
latex-segmenter = { path = "../latex-segmenter" }
latex-terminal = { path = "../latex-terminal" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["macros", "rt"] }

[lints]
workspace = true
