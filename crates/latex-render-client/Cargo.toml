[package]
name = "latex-render-client"
description = "Supervised asynchronous client for the local MathJax worker"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
version.workspace = true

[dependencies]
latex-render-core = { path = "../latex-render-core" }
latex-render-svg = { path = "../latex-render-svg" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
tokio = { version = "=1.53.1", features = ["io-util", "macros", "process", "rt", "sync", "time"] }

[dev-dependencies]
tiny-skia = { version = "=0.12.0", default-features = false, features = ["png-format"] }
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
